---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: ferret
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/kinoite-main-hardened
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: script
    scripts:
      - enable-copr-repos.sh # enables COPRs with the base image's fedora-XX chroot

  - type: dnf
    install:
      packages:
        - rclone
        - gum # for ujust
        - fastfetch
        - lm_sensors
        - lshw
        - tailscale
        - sysstat
        - btop
        - duf
        - lzip
        # - p7zip
        # - p7zip-plugins
        - glow
        - stress-ng
        - snapper
        - btrfs-assistant
        # - ds-inhibit ?
        #copr
        - hhd
        - powerbuttond
        - ryzenadj
        - vpower
        #- ryzen-smu
        #- kmod-ryzen-smu

  - type: script
    scripts:
      # replaces the akmods module (broken on F45: hardcodes rpm-ostree install)
      # kmods to install are listed in the script: xone
      # not installed: kmod-ryzen-smu (no prebuilt kmod for this kernel); gpd-fan is in the kernel
      - install-kmods.sh
      - disable-copr-repos.sh

  - type: systemd
    system:
      disabled: # no automatic updates: update manually to review changes
        - rpm-ostreed-automatic.timer
        - flatpak-system-update.timer
    user:
      disabled:
        - flatpak-user-update.timer

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
